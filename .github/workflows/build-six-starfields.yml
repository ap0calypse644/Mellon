name: Validate Mellon six-image starfield corpus

on:
  push:
    branches: [main]
    paths:
      - 'assets/starfield/corpus-v1/source/**'
      - 'assets/starfield/corpus-v1/catalogs/**'
      - 'tools/starfield/corpus/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Mellon
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r tools/starfield/requirements.txt

      - name: Verify exact source image hashes and pixel-coordinate mappings
        run: |
          python tools/starfield/corpus/validate_multi.py \
            --data assets/starfield/corpus-v1/catalogs \
            --originals assets/starfield/corpus-v1/source

      - name: Verify saved example constellation references
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('assets/starfield/corpus-v1/catalogs')
          folders=[p for p in root.iterdir() if p.is_dir()]
          assert len(folders)==6
          for p in folders:
              stars=json.loads((p/'stars-curated.json').read_text())
              patterns=json.loads((p/'pattern-examples.json').read_text())
              ids={s['id'] for s in stars['stars']}
              assert len(ids)>=300
              assert patterns['source_catalog_image_sha256']==stars['image_sha256']
              for pattern in patterns['patterns'].values():
                  used=pattern['star_ids']
                  assert len(used)==len(set(used))
                  assert all(u in ids for u in used)
                  assert all(0<=a<len(used) and 0<=b<len(used)
                             for a,b in pattern['edges'])
              print(p.name, 'OK', len(ids), 'reference points')
          PY
