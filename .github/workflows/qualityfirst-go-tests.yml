name: Quality-first Go solver unit checks (no search)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qualityfirst-go-tests.yml'
      - 'tools/constellations/qualityfirst/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out current Mellon source (without persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: tools/constellations/qualityfirst/go/go.mod
          cache: false

      - name: Compile, vet and run ONLY synthetic Go unit tests
        run: |
          cd tools/constellations/qualityfirst/go
          go vet ./...
          go test -count=1 -v ./...
          go build -o /tmp/mellon-quality .

      - name: Python 3.12 for syntax and synthetic RGB tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install only preview test dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 Pillow==11.1.0

      - name: Static compile of Python tools (NO constellation search)
        run: |
          python -m py_compile \
            tools/constellations/qualityfirst/prepare_catalog.py \
            tools/constellations/qualityfirst/verify_results.py \
            tools/constellations/qualityfirst/render_review.py \
            tools/constellations/qualityfirst/test_render_review.py
          bash -n tools/constellations/qualityfirst/rebuild_local.sh

      - name: Synthetic RGB star pixel and 1px-line renderer checks
        run: python tools/constellations/qualityfirst/test_render_review.py
