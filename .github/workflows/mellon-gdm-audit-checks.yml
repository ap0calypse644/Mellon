name: Mellon M9 Greeter — Source Safety and Regression
on:
  push:
    branches: [main, m9-gdm-multi-monitor]
    paths:
      - 'lab/gnome50-gdm/**'
      - 'lab/gnome50-m8/**'
      - 'lab/blackpearl-host/**'
      - '.github/workflows/mellon-gdm-audit-checks.yml'
  pull_request:
    paths:
      - 'lab/gnome50-gdm/**'
      - 'lab/gnome50-m8/**'
      - 'lab/blackpearl-host/**'
      - '.github/workflows/mellon-gdm-audit-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gdm-source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Parse both live extension packages
        shell: bash
        run: |
          set -euo pipefail
          for dir in lab/gnome50-m8 lab/gnome50-gdm/greeter-extension; do
            for file in "$dir"/*.js; do
              node --input-type=module --check < "$file"
            done
          done
      - name: Verify M9 visual geometry, native GDM recovery and shared pure math
        shell: bash
        run: |
          set -euo pipefail
          node lab/gnome50-gdm/test-m9-gdm-multimonitor.mjs
          node lab/gnome50-gdm/test-m9-gdm-ui.mjs
          node lab/gnome50-gdm/test-g17-parity-performance.mjs
          node lab/gnome50-gdm/test-g18-hud-runtime.mjs
          node lab/gnome50-m8/test-intro-runtime.mjs
          node lab/gnome50-m8/test-m8-regression.mjs
          node lab/gnome50-m8/test-stellar-effects.mjs
          node lab/gnome50-m8/test-mapping.mjs
      - name: Guard deployment, checksum and rollback procedures
        shell: bash
        run: |
          set -euo pipefail
          bash -n lab/gnome50-gdm/m9-upgrade-blackpearl.sh
          bash -n lab/gnome50-gdm/m9-rollback-blackpearl.sh
          for file in lab/blackpearl-host/*.sh; do bash -n "$file"; done
          node lab/blackpearl-host/test-host-deployment.mjs
          node lab/gnome50-gdm/test-g18-deploy.mjs
          grep -Fq 'sha256sum -c SHA256SUMS' lab/gnome50-gdm/m9-upgrade-blackpearl.sh
          grep -Fq 'mv -T -- "$PREVIOUS" "$ACTIVE"' lab/gnome50-gdm/m9-rollback-blackpearl.sh
          if grep -Eq 'systemctl (restart|stop|start) (gdm|display-manager)' lab/gnome50-gdm/m9-*.sh; then
            echo 'Refusing a GDM upgrade which restarts the live display manager' >&2
            exit 1
          fi
          echo 'PASS: synthetic validation only; no live GDM or VM modifications'
