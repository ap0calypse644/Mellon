name: Go constellation quality-v9 build and synthetic tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quality-v9-go.yml'
      - 'tools/constellations/quality-v9/**'
      - 'tools/constellations/templates-v4-orion-bow.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-test-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/constellations/quality-v9
    steps:
      - name: Checkout verified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Go 1.23
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Verify gofmt
        run: |
          test -z "$(gofmt -l .)"

      - name: Compile and run synthetic unit tests ONLY
        run: go test -count=1 ./...

      - name: Check Go code without invoking the matcher
        run: go vet ./...

      - name: Build executable without performing any search
        run: go build -o "$RUNNER_TEMP/mellon-quality-v9" .
