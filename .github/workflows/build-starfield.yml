name: Index Mellon starfield image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-starfield.yml'
      - 'tools/starfield/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mellon-starfield-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Check out Mellon source (official action pinned to commit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Set up Python (official action pinned to commit)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned scientific packages
        run: python -m pip install --disable-pip-version-check -r tools/starfield/requirements.txt

      - name: Download NASA source photo (unmodified)
        run: python tools/starfield/download_source.py --output assets/starfield/m24-original.jpg

      - name: Identify visible luminous points and graph edges
        run: |
          python tools/starfield/build_catalog.py \
            --image assets/starfield/m24-original.jpg \
            --out assets/starfield \
            --threshold 5.6 \
            --min-separation 5 \
            --limit 25000

      - name: Independent catalog verification against source pixels
        run: |
          python tools/starfield/validate_catalog.py \
            --image assets/starfield/m24-original.jpg \
            --out assets/starfield

      - name: Commit source photo and extracted catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null add -- \
            assets/starfield/m24-original.jpg \
            assets/starfield/stars.json \
            assets/starfield/graph.json \
            assets/starfield/metadata.json \
            assets/starfield/detections-preview.jpg
          if git diff --cached --quiet; then
            echo 'No generated-asset changes'
          else
            git -c core.hooksPath=/dev/null commit -m 'Index NASA M24 starfield and pixel-aligned constellation graph'
            git -c core.hooksPath=/dev/null push origin HEAD:main
          fi
