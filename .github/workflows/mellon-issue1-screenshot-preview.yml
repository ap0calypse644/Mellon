name: Mellon Issue 1 Screenshot Preview (Read-only)

on:
  push:
    paths:
      - .github/workflows/mellon-issue1-screenshot-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch issue 1 attachments and print resized review previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mellon-issue1-review
          cd /tmp/mellon-issue1-review

          curl -fLsS --retry 2 --max-time 60 \
            -o screenshot-1.png \
            'https://github.com/user-attachments/assets/8d9d7d80-3040-4f74-a209-621d286b7edf'
          curl -fLsS --retry 2 --max-time 60 \
            -o screenshot-2.png \
            'https://github.com/user-attachments/assets/cb3c4975-cdff-4321-8a1a-7bea6d7743ce'

          file screenshot-1.png screenshot-2.png
          python3 -m venv .venv
          .venv/bin/pip -q install pillow==11.3.0

          .venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64,hashlib
          for n in (1,2):
              source=Path(f"screenshot-{n}.png")
              image=Image.open(source)
              image.verify()
              image=Image.open(source).convert("RGB")
              print(f"SCREENSHOT_{n}_SOURCE={image.width}x{image.height}")
              image.thumbnail((1180,664),resample=Image.Resampling.LANCZOS)
              preview=Path(f"preview-{n}.jpg")
              image.save(preview,format="JPEG",quality=60,optimize=True)
              content=preview.read_bytes()
              print(f"SCREENSHOT_{n}_PREVIEW_BYTES={len(content)}")
              print(f"SCREENSHOT_{n}_SHA256={hashlib.sha256(content).hexdigest()}")
              b64=base64.b64encode(content).decode("ascii")
              print(f"MELLON_IMAGE_{n}_BEGIN")
              for start in range(0,len(b64),3000):
                  print("MELLON_B64_"+b64[start:start+3000])
              print(f"MELLON_IMAGE_{n}_END")
          PY
