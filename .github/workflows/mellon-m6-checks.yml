name: Mellon M6 scene renderer checks (no VM installation)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mellon-m6-checks.yml'
      - 'lab/gnome50-m6/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m6-unit-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted Mellon repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Node.js for isolated JS tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Validate GNOME GJS source parsing (no GNOME runtime)
        run: |
          node --input-type=module --check < lab/gnome50-m6/extension.js
          node --input-type=module --check < lab/gnome50-m6/scene-data.js
          node --input-type=module --check < lab/gnome50-m6/failure-tracker.js
          node lab/gnome50-m6/test-scene-data.mjs
          node lab/gnome50-m5/test-failure-tracker.mjs

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install only photo-test dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 Pillow==11.1.0

      - name: Synthetic source-pixel RGB boost test (NO astronomy search)
        run: |
          python lab/gnome50-m6/test-pixel-boost.py
          python -m py_compile lab/gnome50-m6/*.py

      - name: Verify scripts are parseable and kept within an isolated shell
        run: |
          bash -n lab/gnome50-m6/deploy-from-blackpearl.sh
          bash -n lab/gnome50-m6/select-scene-in-guest.sh
          grep -q "mellon-gnome50-lab" lab/gnome50-m6/deploy-from-blackpearl.sh
          grep -q 'test "$(gnome-shell --version)" = "GNOME Shell 50.1"' lab/gnome50-m6/deploy-from-blackpearl.sh
          echo 'PASS: M6 no-search unit validation only'
