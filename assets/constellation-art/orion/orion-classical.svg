<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="980" height="1250" viewBox="-490 -620 980 1250" version="1.1" role="img" aria-label="Orion, classical celestial hunter, raised club, animal hide, flowing drapery, engraved in silver-lilac light">
<title>Orion the Hunter — A classical celestial engraving</title>
<desc>Original hand-authored SVG vector composition. Orion holds a raised wooden club and an animal hide, with naturalistic classical figure anatomy, windborne chiton and hair. Editable named art layers. The nine reference anchor coordinates remain fixed to the historical nine-star Orion-core geometry, and background star positions are never changed.</desc>
