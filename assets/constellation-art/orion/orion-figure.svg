<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1250" viewBox="-490 -620 980 1250" version="1.1" role="img" aria-label="Orion, astral hunter: original editable celestial engraving">
  <title>Orion — The Hunter / Astral Atlas engraving</title>
  <desc>Original layered line illustration in 1000-unit Orion template coordinates, with a nine-star head, shoulder, belt, leg, and sword alignment. Paths are ordered for later draw-on animation. Not a background image.</desc>
  <defs>
    <linearGradient id="nightplate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1b29" stop-opacity=".60"/>
      <stop offset=".55" stop-color="#17222f" stop-opacity=".27"/>
      <stop offset="1" stop-color="#070f1b" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182c39" stop-opacity=".42"/>
      <stop offset="1" stop-color="#07111d" stop-opacity=".10"/>
    </linearGradient>
  </defs>
  <style>
    .edge {fill:none;stroke:#e4bd8e;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;opacity:.90}
    .fine {fill:none;stroke:#e2c398;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.64}
    .etch {fill:none;stroke:#9eb8c6;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round;opacity:.52}
    .glint {fill:none;stroke:#a9e7ee;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
    .plate {fill:url(#nightplate);stroke:#d5ae7d;stroke-width:3.2;stroke-linejoin:round;opacity:.88}
    .cloth {fill:url(#silk);stroke:#c8a77c;stroke-width:2.7;stroke-linejoin:round;opacity:.77}
    .metal {fill:#273a49;fill-opacity:.32;stroke:#e7c695;stroke-width:2.7;stroke-linejoin:round;opacity:.96}
    .glyph {fill:#ecd3aa;opacity:.68}
    .stud {fill:#a9e7ee;stroke:#f0cea0;stroke-width:1.6;opacity:.92}
  </style>

